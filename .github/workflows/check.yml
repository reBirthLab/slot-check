on:
  workflow_dispatch:
    inputs:
      test:
        type: boolean
        default: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash check.sh
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          API_URL: ${{ secrets.API_URL }}
          TARGET: ${{ vars.TARGET }}
          TEST: ${{ inputs.test }}
